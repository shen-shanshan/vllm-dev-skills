  <text x="490.0" y="520.0" class="c">8 份 [B, 16, D] + LSE</text>
  <rect x="410" y="570" width="160" height="50" class="n-out"/>
  <text x="490.0" y="586.0" class="c w">按 LSE 加权合并</text>
  <text x="490.0" y="604.0" class="c w">O：[B, 16, D]</text>
  <path d="M490 540 V570" class="e"/>
