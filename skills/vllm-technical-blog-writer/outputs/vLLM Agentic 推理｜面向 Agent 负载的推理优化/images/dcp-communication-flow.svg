  <text x="490.0" y="240.0" class="c">q：[B, 128, D]</text>
  <rect x="410" y="290" width="160" height="50" class="n-key"/>
  <text x="490.0" y="306.0" class="c w">Attention</text>
  <text x="490.0" y="324.0" class="c w">128 head × 本卡 1/8 KV</text>
