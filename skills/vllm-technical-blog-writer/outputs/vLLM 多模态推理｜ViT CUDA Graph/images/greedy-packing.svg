<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#ffffff" /><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#64748b" /></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#1f2937;font-size:15px}.title{font-size:23px;font-weight:600}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.neutral{fill:#f8fafc;stroke:#64748b;stroke-width:1.5}.edge{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.note{font-size:13px;fill:#475569}</style><text x="40" y="38" text-anchor="start" class="title"><tspan x="40" dy="0">Greedy Packing：output_tokens 升序 + Sequential Next-Fit</tspan></text><rect x="35" y="115" width="230" height="75" rx="8" class="neutral" /><text x="150.0" y="146.5" text-anchor="middle"><tspan x="150.0" dy="0">原始 Item Token</tspan><tspan x="150.0" dy="22">900, 300, 700, 500</tspan></text><rect x="330" y="115" width="230" height="75" rx="8" class="node" /><text x="445.0" y="146.5" text-anchor="middle"><tspan x="445.0" dy="0">升序排序</tspan><tspan x="445.0" dy="22">300, 500, 700, 900</tspan></text><rect x="330" y="270" width="230" height="70" rx="8" class="neutral" /><text x="445.0" y="299.0" text-anchor="middle"><tspan x="445.0" dy="0">max_budget = 1024</tspan><tspan x="445.0" dy="22">max_items = 2</tspan></text><rect x="670" y="70" width="420" height="75" rx="8" class="node" /><text x="880.0" y="101.5" text-anchor="middle"><tspan x="880.0" dy="0">Sub-batch 1：300 + 500 = 800</tspan><tspan x="880.0" dy="22">选择 1024 Budget</tspan></text><rect x="670" y="185" width="420" height="70" rx="8" class="node" /><text x="880.0" y="214.0" text-anchor="middle"><tspan x="880.0" dy="0">Sub-batch 2：700</tspan><tspan x="880.0" dy="22">选择 1024 Budget</tspan></text><rect x="670" y="295" width="420" height="70" rx="8" class="node" /><text x="880.0" y="324.0" text-anchor="middle"><tspan x="880.0" dy="0">Sub-batch 3：900</tspan><tspan x="880.0" dy="22">选择 1024 Budget</tspan></text><rect x="35" y="390" width="525" height="60" rx="8" class="neutral" /><text x="297.5" y="414.0" text-anchor="middle"><tspan x="297.5" dy="0">Sequential Next-Fit</tspan><tspan x="297.5" dy="22">工程启发式，并非一般装箱全局最优</tspan></text><path d="M265 152 L330 152" class="edge" /><path d="M560 145 L670 108" class="edge" /><path d="M560 152 L670 220" class="edge" /><path d="M560 160 L670 330" class="edge" /><path d="M445 270 L720 145" class="edge" /><path d="M560 420 L445 190" class="edge" stroke-dasharray="5 4" /></svg>