<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <!-- draw.io "classic" arrowheads, one per edge color -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5z" fill="#000000"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5z" fill="#cc0000"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5z" fill="#0066cc"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5z" fill="#006600"/></marker>
    <marker id="arrow-darkred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5z" fill="#660000"/></marker>
    <!-- draw.io gradients: light top -> saturated bottom -->
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dae8fc"/><stop offset="1" stop-color="#7ea6e0"/></linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8cecc"/><stop offset="1" stop-color="#ea6b66"/></linearGradient>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2cc"/><stop offset="1" stop-color="#ffd966"/></linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5e8d4"/><stop offset="1" stop-color="#97d077"/></linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcd28"/><stop offset="1" stop-color="#ffa500"/></linearGradient>
    <linearGradient id="g-gray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f5f5"/><stop offset="1" stop-color="#b3b3b3"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Comic Sans MS", "Comic Sans", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", cursive; font-size: 12px; fill: #000000; dominant-baseline: central; }
    .c { text-anchor: middle; }
    .w { fill: #ffffff; }
    .b { font-weight: bold; }
    .hl { fill: #cc0000; }
    .panel-title { font-size: 16px; text-anchor: middle; }
    .sys-title { font-size: 20px; font-weight: bold; font-style: italic; text-anchor: middle; }
    rect, path, polygon, circle { stroke-width: 1; }
    /* key function / op / module: dark red, white text */
    .n-key { fill: #a20025; stroke: #6f0000; }
    /* output-path function: strong blue, white text */
    .n-out { fill: #1ba1e2; stroke: #006eaf; }
    /* big model bar (LLM / decoder / DiT): violet, white text */
    .n-model { fill: #6a00ff; stroke: #3700cc; }
    /* framework / system container node: purple-gray, white text */
    .n-sys { fill: #76608a; stroke: #432d57; }
    /* pastel pairs */
    .n-blue { fill: #dae8fc; stroke: #6c8ebf; }
    .n-green { fill: #d5e8d4; stroke: #82b366; }
    .n-yellow { fill: #fff2cc; stroke: #d6b656; }
    .n-orange { fill: #ffe6cc; stroke: #d79b00; }
    .n-red { fill: #f8cecc; stroke: #b85450; }
    .n-purple { fill: #e1d5e7; stroke: #9673a6; }
    .n-cyan { fill: #b1ddf0; stroke: #10739e; }
    .n-salmon { fill: #fad9d5; stroke: #ae4132; }
    .n-cream { fill: #f9f7ed; stroke: #36393d; }
    /* containers */
    .box-outer { fill: #eeeeee; stroke: #36393d; }
    .box-inner { fill: #f5f5f5; stroke: #666666; }
    .box-dashed { fill: none; stroke: #666666; stroke-dasharray: 3 3; }
    .panel { fill: #f5f5f5; stroke: #666666; stroke-dasharray: 3 3; }
    /* edges: 1px orthogonal polylines */
    .e { fill: none; stroke: #000000; marker-end: url(#arrow-black); }
    .e-req { fill: none; stroke: #cc0000; marker-end: url(#arrow-red); }
    .e-resp { fill: none; stroke: #0066cc; marker-end: url(#arrow-blue); }
    .e-alt1 { fill: none; stroke: #006600; marker-end: url(#arrow-green); }
    .e-alt2 { fill: none; stroke: #660000; marker-end: url(#arrow-darkred); }
    .block-arrow { fill: #a20025; stroke: #6f0000; }
    .step-arrow { fill: #ffffff; stroke: #000000; }
  </style>
  <rect width="1000" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="640" height="560" class="box-dashed"/>
  <text x="36" y="36" class="b">MI355X 服务器（8 × GPU）</text>
  <rect x="40" y="60" width="600" height="120" class="box-outer"/>
  <text x="50" y="76" class="b">L1：GPU HBM3E（热）</text>
  <rect x="60" y="100" width="100" height="60" fill="#60a917" stroke="#2d7600"/>
  <text x="110.0" y="121.0" class="c w">GPU 0</text>
  <text x="110.0" y="139.0" class="c w">288 GB · 8 TB/s</text>
  <rect x="180" y="100" width="100" height="60" fill="#60a917" stroke="#2d7600"/>
  <text x="230.0" y="121.0" class="c w">GPU 1</text>
  <text x="230.0" y="139.0" class="c w">288 GB · 8 TB/s</text>
  <rect x="300" y="100" width="100" height="60" fill="#60a917" stroke="#2d7600"/>
  <text x="350.0" y="121.0" class="c w">GPU 2</text>
  <text x="350.0" y="139.0" class="c w">288 GB · 8 TB/s</text>
  <rect x="520" y="100" width="100" height="60" fill="#60a917" stroke="#2d7600"/>
  <text x="570.0" y="121.0" class="c w">GPU 7</text>
  <text x="570.0" y="139.0" class="c w">288 GB · 8 TB/s</text>
  <text x="470" y="130" class="c">……</text>
  <rect x="40" y="260" width="600" height="120" class="box-outer"/>
  <text x="50" y="276" class="b">L2：CPU DRAM（温）</text>
  <rect x="60" y="300" width="260" height="60" class="n-blue"/>
  <text x="190.0" y="321.0" class="c">Host KV Buffer / UMBP DRAM Pool</text>
  <text x="190.0" y="339.0" class="c">每节点 TB 级（实验预算 1 TB）</text>
  <rect x="360" y="300" width="260" height="60" class="n-cream"/>
  <text x="490.0" y="321.0" class="c">本地 memcpy 上限 ~104 GB/s</text>
  <text x="490.0" y="339.0" class="c">4 线程实测 ~66 GB/s</text>
  <rect x="40" y="460" width="600" height="100" class="box-outer"/>
  <text x="50" y="476" class="b">L3：NVMe SSD（冷）</text>
  <rect x="60" y="495" width="260" height="50" class="n-yellow"/>
  <text x="190.0" y="520.0" class="c">数 TB ~ 数十 TB（取决于盘数）</text>
  <rect x="360" y="495" width="260" height="50" class="n-cream"/>
  <text x="490.0" y="520.0" class="c">单盘 PCIe 5.0 x4 理论 ~16 GB/s</text>
  <path d="M180 180 V260" class="e-req"/>
  <path d="M220 260 V180" class="e-resp"/>
  <text x="240" y="210">PCIe 5.0 x16（单向理论 64 GB/s）</text>
  <text x="240" y="230" style="fill:#0066cc">load：SDMA Zero-CU 回填，实测 ~51 GB/s</text>
  <text x="170" y="210" class="hl" text-anchor="end">offload</text>
  <text x="170" y="230" text-anchor="end" style="fill:#0066cc">load</text>
  <text x="170" y="410" class="hl" text-anchor="end">offload</text>
  <text x="170" y="430" text-anchor="end" style="fill:#0066cc">load</text>
  <path d="M180 380 V460" class="e-req"/>
  <path d="M220 460 V380" class="e-resp"/>
  <text x="240" y="410">NVMe 读写（GPU Direct Storage / GPU 发起 NVMe：规划中）</text>
  <rect x="700" y="240" width="280" height="200" class="box-dashed"/>
  <text x="716" y="256" class="b">其他节点</text>
  <rect x="720" y="280" width="240" height="50" class="n-blue"/>
  <text x="840.0" y="305.0" class="c">远端 DRAM Pool / SSD</text>
  <rect x="720" y="340" width="240" height="40" class="n-sys"/>
  <text x="840.0" y="360.0" class="c w">UMBP Master：KV 放置目录</text>
  <path d="M640 320 H720" class="e-req"/>
  <path d="M720 300 H640" class="e-resp"/>
  <text x="840" y="400" class="c">RDMA（Pollara 400G NIC）</text>
  <text x="840" y="420" class="c hl">实测 ~42 GB/s</text>
  <rect x="700" y="480" width="280" height="80" rx="6" class="n-cream"/>
  <text x="840.0" y="502.0" class="c">容量：L1 &lt; L2 &lt; L3</text>
  <text x="840.0" y="520.0" class="c">带宽：L1 &gt; L2 &gt; L3</text>
  <text x="840.0" y="538.0" class="c">目标：回填与前向计算重叠</text>
</svg>
